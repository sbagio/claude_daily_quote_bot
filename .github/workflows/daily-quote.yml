name: Daily Quote

on:
  schedule:
    # Backup only. The 07:00 delivery comes from an external cron (cron-job.org, Asia/Jerusalem)
    # calling the workflow_dispatch API: GitHub starts scheduled runs hours late and, with hourly
    # slots, created only ~2 of 7 per day (Sep 2026), so it can't hit a morning time on its own.
    # If the external call fails, this run sends late; otherwise should_send() skips it.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, even if today's quote already went out"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-quote
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled runs default to the SHA from when they were queued; a later slot needs the
          # sent_history.json an earlier slot pushed, or it double-sends.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily quote
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main ${{ inputs.force && '--ignore-schedule' || '' }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/sent_history.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update sent history [skip ci]"
            git push
          fi
