name: Daily Quote

on:
  schedule:
    # Wake-up slots, not the send time. GitHub starts scheduled runs 4-8h late (Oct 2026) and
    # creates only some of them, so slots run hourly from evening through morning (UTC). The
    # first run that starts within MAX_WAIT_MINUTES of 07:00 Israel time sleeps until 07:00 and
    # sends; earlier runs exit, later ones see today's send in the history and exit.
    - cron: "17 0-4,14-23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, even if today's quote already went out"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-quote
  cancel-in-progress: false

env:
  # Sleeping is free only on a public repo (standard runners, unlimited minutes). Must stay
  # below the job timeout.
  MAX_WAIT_MINUTES: 330

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled runs default to the SHA from when they were queued; a later slot needs the
          # sent_history.json an earlier slot pushed, or it double-sends.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Zero-cost guarantee: if the repo is ever made private (billed minutes), or the check
      # fails, never sleep.
      - name: Wait budget
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility || true)"
          if [ "$visibility" = "public" ]; then minutes="$MAX_WAIT_MINUTES"; else minutes=0; fi
          echo "visibility=${visibility:-unknown} max_wait_minutes=$minutes"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

      - name: Send daily quote
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          python -m src.main --max-wait-minutes ${{ steps.budget.outputs.minutes }}
          ${{ inputs.force && '--ignore-schedule' || '' }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/sent_history.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update sent history [skip ci]"
            git push
          fi
