name: Daily Quote

on:
  schedule:
    # Hourly wake-up slots, not the delivery time. GitHub starts scheduled runs anywhere from
    # minutes to 5+ hours late, so src/main.py sends on the first slot that starts at or after
    # 06:30 Israel time and later slots skip. With hourly spacing that lands 06:30-07:30 local
    # for any delay up to ~5.5h, in both IDT and IST. :43 avoids the top-of-hour queue spike.
    - cron: "43 22,23,0,1,2,3,4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-quote
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled runs default to the SHA from when they were queued; a later slot needs the
          # sent_history.json an earlier slot pushed, or it double-sends.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily quote
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main ${{ github.event_name == 'workflow_dispatch' && '--ignore-schedule' || '' }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/sent_history.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update sent history [skip ci]"
            git push
          fi
